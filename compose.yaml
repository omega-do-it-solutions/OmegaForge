name: ${COMPOSE_PROJECT_NAME:-omega-forge}

services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.41@sha256:43b768cd62b00d132439cda881b93fd1adebf1b315e996e794087743821d771d
    profiles:
      - storage
    command:
      - mini
      - -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-local-admin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-local-development-secret-change-me}
      S3_BUCKET: ${S3_BUCKET:-app-files}
    ports:
      - "127.0.0.1:${S3_PORT:-18333}:8333"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget --spider --quiet http://127.0.0.1:9333/cluster/status &&
          wget --spider --quiet http://127.0.0.1:8888/
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  seaweedfs-data:
